name: Build Orbit APK

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Link da release do AIR SDK 51"
        required: true
        default: "https://github.com/gafso/sdk/releases/tag/Sdk"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          mkdir -p proj
          if [ -f orbit.zip ]; then
            unzip -q -o orbit.zip -d proj
          elif [ -f launcher.zip ]; then
            unzip -q -o launcher.zip -d proj
          else
            cp -r . proj/ || true
          fi
          B=$(find proj -name build.sh | head -1)
          if [ -z "$B" ]; then
            echo "build.sh nao encontrado"
            find proj | head -30
            exit 1
          fi
          echo "PROJ=$(dirname $B)" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar AIR SDK
        env:
          SDK_URL: ${{ github.event.inputs.sdk_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          URL="$SDK_URL"
          if echo "$URL" | grep -q "github.com/.*/releases/tag/"; then
            REPO=$(echo "$URL" | sed -E 's|https://github.com/([^/]+)/([^/]+)/releases/tag/.*|\1/\2|')
            TAG=$(echo "$URL" | sed -E 's|.*/tag/([^/?#]+).*|\1|')
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG" -o rel.json
            URL=$(jq -r '.assets[] | select(.name | test("zip|tar.gz")) | .url' rel.json | head -1)
          fi
          curl -L --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o sdk.zip "$URL" || curl -L --fail -o sdk.zip "$URL"
          mkdir -p sdk && unzip -q sdk.zip -d sdk
          echo "AIR_SDK=$(find sdk -name adt.jar | head -1 | xargs dirname | xargs dirname)" >> $GITHUB_ENV

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Compilar
        run: |
          export ANDROID_JAR=$(find $ANDROID_HOME -name android.jar | head -1)
          cd $PROJ
          chmod +x build.sh
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-apk
          path: ${{ env.PROJ }}/build/Orbit.apk
