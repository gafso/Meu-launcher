name: Build PC (Windows)

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "Obrigatorio: URL do AIR SDK Windows (.zip) ou pagina/release no GitHub que contenha o zip"
        required: true
        default: ""

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Achar o projeto
        run: |
          New-Item -ItemType Directory -Force proj | Out-Null
          if (Test-Path launcher-pc.zip) {
            Expand-Archive -Path launcher-pc.zip -DestinationPath proj -Force
          } else {
            Get-ChildItem -Force | Where-Object { $_.Name -notin @('proj', '.git') } | Copy-Item -Destination proj -Recurse -Force
          }
          $a = Get-ChildItem -Path proj -Recurse -Filter app.xml | Where-Object { Test-Path (Join-Path $_.DirectoryName 'src\Main.as') } | Select-Object -First 1
          if (-not $a) {
            Write-Host "ERRO: nao achei app.xml junto de src\Main.as. Arquivos do repositorio:"
            Get-ChildItem -Recurse -Depth 3 | Select-Object -First 80 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Projeto em: $($a.DirectoryName)"
          "PROJ=$($a.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar o AIR SDK
        env:
          SDK_URL: ${{ github.event.inputs.sdk_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = ($env:SDK_URL).Trim()
          if (-not $url) { throw 'sdk_url vazio. Informe o link do AIR SDK Windows (.zip) ou da release no GitHub.' }
          Write-Host "SDK_URL = $url"
          $name = ''
          $hdr = @{ 'User-Agent' = 'actions' }
          if ($env:GH_TOKEN) { $hdr['Authorization'] = "Bearer $env:GH_TOKEN" }

          if ($url -match 'github\.com/([^/]+)/([^/]+)/releases/tag/([^/?#]+)') {
            $owner = $Matches[1]; $repo = $Matches[2]; $tag = $Matches[3]
            $api = "https://api.github.com/repos/$owner/$repo/releases/tags/$tag"
            Write-Host "API release: $api"
            $rel = $null
            try { $rel = Invoke-RestMethod -Uri $api -Headers $hdr } catch {
              Write-Host "Tag nao encontrada. Tentando /releases/latest ..."
              try { $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/$owner/$repo/releases/latest" -Headers $hdr } catch {
                throw "Release do SDK nao encontrada (404). Repo=$owner/$repo tag=$tag. Use um sdk_url valido: pagina da release ou link direto do .zip do AIR SDK Windows."
              }
            }
            Write-Host "Release: $($rel.tag_name)"
            foreach ($a in $rel.assets) { Write-Host "  asset: $($a.name) ($($a.size) bytes)" }
            $cands = @($rel.assets | Where-Object { $_.name -match '\.(zip|tar\.gz|tgz|tar\.bz2|tbz2)$' })
            $pick = $cands | Where-Object { $_.name -match 'win' } | Sort-Object size -Descending | Select-Object -First 1
            if (-not $pick) { $pick = $cands | Sort-Object size -Descending | Select-Object -First 1 }
            if (-not $pick) { throw 'Nenhum .zip/.tar na release. Suba o AIR SDK Windows como asset.' }
            $name = $pick.name
            Write-Host "Baixando asset: $name"
            Invoke-WebRequest -Uri $pick.url -OutFile sdk_download -Headers (@{ Accept = 'application/octet-stream' } + $hdr)
          } elseif ($url -match 'github\.com/([^/]+)/([^/]+)/releases/download/') {
            $name = Split-Path ($url.Split('?')[0]) -Leaf
            Write-Host "Baixando asset direto: $name"
            Invoke-WebRequest -Uri $url -OutFile sdk_download -Headers $hdr
          } else {
            $name = Split-Path ($url.Split('?')[0]) -Leaf
            if (-not $name) { $name = 'sdk.zip' }
            Write-Host "Baixando URL direta: $url"
            Invoke-WebRequest -Uri $url -OutFile sdk_download
          }

          $dest = Join-Path $env:RUNNER_TEMP 'airsdk'
          New-Item -ItemType Directory -Force $dest | Out-Null
          if ($name -match '\.zip$' -or (Get-Item sdk_download).Extension -eq '.zip') {
            Expand-Archive -Path sdk_download -DestinationPath $dest -Force
          } else {
            & "$env:SystemRoot\System32\tar.exe" -xf sdk_download -C $dest
            if ($LASTEXITCODE -ne 0) { throw 'falha ao extrair o SDK' }
          }
          $f = Get-ChildItem -Path $dest -Recurse -Depth 4 -Filter air-sdk-description.xml | Select-Object -First 1
          if (-not $f) { throw 'air-sdk-description.xml nao encontrado: arquivo nao e o AIR SDK' }
          $sdk = $f.DirectoryName
          Get-Content "$sdk\air-sdk-description.xml" | ForEach-Object { Write-Host $_ }
          Write-Host 'Pasta runtimes do SDK:'
          Get-ChildItem "$sdk\runtimes" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          if (Test-Path "$sdk\runtimes\air\win64") { Write-Host 'OK: runtime win64 presente no SDK' }
          elseif (Test-Path "$sdk\runtimes\air-captive\win64") { Write-Host 'OK: air-captive\win64 presente' }
          else { Write-Host 'AVISO: nao achei win64 no SDK' }
          if (-not (Test-Path "$sdk\runtimes\air\win")) {
            Write-Host 'AVISO: este SDK nao tem runtimes\air\win.'
          }
          "AIR_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:AIR_SDK
          $desc = Get-Content "$sdk\air-sdk-description.xml" -Raw
          $v = [regex]::Match($desc, '<version>([^<]+)</version>').Groups[1].Value
          $p = $v.Split('.')
          $ns = "$($p[0]).$($p[1])"
          Write-Host "AIR SDK $v (namespace $ns)"
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build\app | Out-Null
          $xml = (Get-Content app.xml -Raw).Replace('NS_VERSION', $ns).Replace('VERSION_NUMBER', "1.0.$env:RUN_NUM")
                    $xml = $xml -replace '<supportedProfiles>\s*desktop\s*</supportedProfiles>', '<supportedProfiles>extendedDesktop</supportedProfiles>'
          if ($xml -notmatch 'extendedDesktop') {
            $xml = $xml -replace '<supportedProfiles>[^<]*</supportedProfiles>', '<supportedProfiles>extendedDesktop</supportedProfiles>'
          }
          if ($xml -notmatch '<architecture>') {
            $xml = $xml.Replace('</supportedProfiles>', ('</supportedProfiles>' + [char]10 + '    <architecture>32</architecture>'))
          } else {
            $xml = $xml -replace '<architecture>\s*\d+\s*</architecture>', '<architecture>32</architecture>'
          }
          $xml | Set-Content 'build/app/app.xml' -Encoding utf8
          Write-Host 'app.xml architecture:'
          Select-String -Path 'build/app/app.xml' -Pattern 'architecture' 

          Write-Host '==> 1/3 Compilando o ActionScript'
          & "$sdk\bin\amxmlc.bat" -source-path src -default-size 1352 650 -output build\app\Main.swf src\Main.as
          if (-not (Test-Path build\app\Main.swf)) { throw 'amxmlc nao gerou o Main.swf (veja os erros acima)' }
          Copy-Item assets build\app\assets -Recurse

          Write-Host '==> 2/3 Certificado de assinatura'
          & "$sdk\bin\adt.bat" -certificate -cn LegendPC -validityPeriod 25 2048-RSA build\cert.p12 changeit
          if ($LASTEXITCODE -ne 0) { throw 'falha ao criar o certificado' }

          Write-Host '==> 3/3 Empacotando (pasta com o LegendPC.exe, Windows x64)'
          # Força arquitetura x64 no ADT (DefaultArch / OverrideArch), senão alguns SDKs ignoram -arch
          $adtCfgDir = Join-Path $env:USERPROFILE '.airsdk'
          New-Item -ItemType Directory -Force $adtCfgDir | Out-Null
          @(
            'DefaultArch=x86'
            'OverrideArch=x86'
          ) | Set-Content (Join-Path $adtCfgDir 'adt.cfg') -Encoding ascii
          $sdkCfg = Join-Path $sdk 'lib\adt.cfg'
          try {
            @(
              'DefaultArch=x86'
              'OverrideArch=x86'
            ) | Set-Content $sdkCfg -Encoding ascii
            Write-Host "adt.cfg escrito em $adtCfgDir e $sdkCfg"
          } catch {
            Write-Host "aviso: nao gravou lib\adt.cfg ($($_.Exception.Message))"
          }

          # Ordem: -target bundle (documentado pela Harman / fórum Starling)
          & "$sdk\bin\adt.bat" -package `
            -storetype pkcs12 -keystore build\cert.p12 -storepass changeit -tsa none `
            -target bundle `
            build\LegendPC build\app\app.xml `
            -C build\app Main.swf -C build\app assets
          if ($LASTEXITCODE -ne 0) {
            throw 'falha ao empacotar x64 (veja os erros acima; use AIR SDK Windows completo da Harman com runtime win64)'
          }

          # Confirma PE Machine = AMD64 (0x8664). Se for 0x14C ainda e 32-bit → falha o job.
          $exe = Get-ChildItem -Path build\LegendPC -Filter '*.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'nenhum .exe encontrado em build\LegendPC' }
          $fs = [IO.File]::OpenRead($exe.FullName)
          $br = New-Object IO.BinaryReader $fs
          $fs.Seek(0x3C, 'Begin') | Out-Null
          $peOff = $br.ReadInt32()
          $fs.Seek($peOff + 4, 'Begin') | Out-Null
          $machine = $br.ReadUInt16()
          $br.Close(); $fs.Close()
          $hex = '0x{0:X4}' -f $machine
          Write-Host ("EXE: {0} | PE Machine={1}" -f $exe.FullName, $hex)
          if ($machine -eq 0x14C) {
            Write-Host 'OK: executavel e 32-bit (x86) — login HTMLLoader estavel.'
          } elseif ($machine -eq 0x8664) {
            Write-Host 'AVISO: gerou 64-bit; login embutido pode falhar nos cliques. Preferimos 32-bit neste projeto.'
          } else {
            Write-Host "AVISO: PE Machine inesperado ($hex)."
          }
          Get-ChildItem build\LegendPC | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Instalador alternativo (.air, precisa do Adobe AIR no PC)
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          & "$env:AIR_SDK\bin\adt.bat" -package -storetype pkcs12 -keystore build\cert.p12 -storepass changeit -tsa none -target air build\LegendPC.air build\app\app.xml -C build\app Main.swf -C build\app assets

      - uses: actions/upload-artifact@v4
        with:
          name: LegendPC-Windows
          path: ${{ env.PROJ }}/build/LegendPC

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LegendPC-air-alternativo
          path: ${{ env.PROJ }}/build/LegendPC.air
