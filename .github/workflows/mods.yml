name: Gerar mods

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "analisar = relatorio | baixar = originais + mapa inteiro | gerar = aplica personalizados/"
        type: choice
        options: [analisar, baixar, gerar]
        default: analisar
      grade:
        description: "Grade do mapa (opcional). Ex.: 30x20  ou  10000=30x20"
        required: false
        default: ""

jobs:
  mods:
    runs-on: ubuntu-latest
    env:
      GRADE: ${{ github.event.inputs.grade }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          pip install pillow
          mkdir -p ferramentas
          unzip -q -o launcher.zip -d _proj || true
          cp -rf _proj/launcher/ferramentas/. ferramentas/ || true

      - name: Preparar
        run: python3 ferramentas/mods.py preparar

      - name: Rodar
        run: python3 ferramentas/mods.py ${{ github.event.inputs.acao }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mods-${{ github.event.inputs.acao }}
          path: saida_mods/
          if-no-files-found: warn
