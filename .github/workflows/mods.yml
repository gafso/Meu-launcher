name: Gerar mods

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "analisar = relatorio | baixar = originais + mapa inteiro | gerar = aplica personalizados/ | swf = identifica castelo (imagens dos .swf) | castelo = troca os fundos do castelo | predios = recolore/troca os 8 predios do castelo"
        type: choice
        options: [analisar, baixar, gerar, swf, castelo, predios]
        default: analisar
      grade:
        description: "Grade do mapa (opcional). Ex.: 30x20  ou  10000=30x20"
        required: false
        default: ""
      swf_urls:
        description: "So para a acao swf (opcional): links de .swf separados por espaco. Vazio = os do castelo"
        required: false
        default: ""
      imagem_url:
        description: "Opcional: link direto de uma imagem grande (ex.: asset de uma Release) para salvar em personalizados/"
        required: false
        default: ""
      imagem_nome:
        description: "Nome para salvar a imagem baixada (ex.: mapa_10000.png ou loading_bg.jpg)"
        required: false
        default: "mapa_10000.png"

jobs:
  mods:
    runs-on: ubuntu-latest
    env:
      GRADE: ${{ github.event.inputs.grade }}
      SWF_URLS: ${{ github.event.inputs.swf_urls }}
      IMAGEM_URL: ${{ github.event.inputs.imagem_url }}
      IMAGEM_NOME: ${{ github.event.inputs.imagem_nome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: |
          pip install pillow
          mkdir -p ferramentas
          unzip -q -o launcher.zip -d _proj || true
          cp -rn _proj/launcher/ferramentas/. ferramentas/ || true

      - name: Baixar imagem grande (se informada)
        if: ${{ github.event.inputs.imagem_url != '' }}
        run: |
          mkdir -p personalizados
          curl -L --fail --retry 3 -o "personalizados/${IMAGEM_NOME}" "${IMAGEM_URL}"
          ls -lh personalizados/
          file "personalizados/${IMAGEM_NOME}"
          if ! file "personalizados/${IMAGEM_NOME}" | grep -qi "image"; then
            echo "ERRO: o arquivo baixado NAO e uma imagem (provavelmente o link e da pagina da release, nao do arquivo). Primeiros bytes:"
            head -c 300 "personalizados/${IMAGEM_NOME}"; exit 1
          fi

      - name: Preparar
        run: python3 ferramentas/mods.py preparar

      - name: Rodar
        run: python3 ferramentas/mods.py ${{ github.event.inputs.acao }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mods-${{ github.event.inputs.acao }}
          path: saida_mods/
          if-no-files-found: warn
