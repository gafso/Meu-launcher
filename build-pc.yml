name: Build PC (Windows)

on:
  workflow_dispatch:
    inputs:
      sdk_url:
        description: "AIR SDK 51 para WINDOWS (página da release OU link direto do arquivo)"
        required: true
        default: "https://github.com/gafso/sdk/releases/tag/Sdkatt"
      instancias:
        description: "Quantas janelas do jogo o instalador deve ter (Legend PC, Legend PC 2, ...) - de 1 a 6"
        required: false
        default: "3"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Achar o projeto
        run: |
          New-Item -ItemType Directory -Force proj | Out-Null
          if (Test-Path launcher-pc.zip) {
            Expand-Archive -Path launcher-pc.zip -DestinationPath proj -Force
          } else {
            Get-ChildItem -Force | Where-Object { $_.Name -notin @('proj', '.git') } | Copy-Item -Destination proj -Recurse -Force
          }
          $a = Get-ChildItem -Path proj -Recurse -Filter app.xml | Where-Object { Test-Path (Join-Path $_.DirectoryName 'src\Main.as') } | Select-Object -First 1
          if (-not $a) {
            Write-Host "ERRO: nao achei app.xml junto de src\Main.as. Arquivos do repositorio:"
            Get-ChildItem -Recurse -Depth 3 | Select-Object -First 80 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "Projeto em: $($a.DirectoryName)"
          "PROJ=$($a.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Baixar o AIR SDK
        env:
          SDK_URL: ${{ github.event.inputs.sdk_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $url = $env:SDK_URL
          $name = ''
          if ($url -match 'github\.com/([^/]+)/([^/]+)/releases/tag/([^/?#]+)') {
            $api = "https://api.github.com/repos/$($Matches[1])/$($Matches[2])/releases/tags/$($Matches[3])"
            $auth = $true
            try {
              $rel = Invoke-RestMethod -Uri $api -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'actions' }
            } catch {
              Write-Host "Falhou com o token do Actions ($($_.Exception.Message)). Tentando sem token (repositorio publico)..."
              $auth = $false
              try {
                $rel = Invoke-RestMethod -Uri $api -Headers @{ 'User-Agent' = 'actions' }
              } catch {
                throw "Release nao encontrada em $api. Confira o link (repositorio PUBLICO, release publicada e nao rascunho, tag certa). Alternativa: cole o link DIRETO do arquivo do SDK (clique com o botao direito no arquivo da release > copiar link)."
              }
            }
            Write-Host 'Arquivos da release:'
            foreach ($a in $rel.assets) { Write-Host "  $($a.name)  ($($a.size) bytes)" }
            $cands = @($rel.assets | Where-Object { $_.name -match '\.(zip|tar\.gz|tgz|tar\.bz2|tbz2)$' })
            $pick = $cands | Where-Object { $_.name -match 'win' } | Sort-Object size -Descending | Select-Object -First 1
            if (-not $pick) { $pick = $cands | Sort-Object size -Descending | Select-Object -First 1 }
            if (-not $pick) { throw 'nenhum .zip/.tar na release' }
            $name = $pick.name
            Write-Host "Baixando: $name"
            if ($auth) {
              Invoke-WebRequest -Uri $pick.url -OutFile sdk_download -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream'; 'User-Agent' = 'actions' }
            } else {
              Invoke-WebRequest -Uri $pick.browser_download_url -OutFile sdk_download -Headers @{ 'User-Agent' = 'actions' }
            }
          } else {
            $name = Split-Path ($url.Split('?')[0]) -Leaf
            Write-Host "Baixando: $url"
            Invoke-WebRequest -Uri $url -OutFile sdk_download
          }
          $dest = Join-Path $env:RUNNER_TEMP 'airsdk'
          New-Item -ItemType Directory -Force $dest | Out-Null
          if ($name -match '\.zip$') {
            Expand-Archive -Path sdk_download -DestinationPath $dest -Force
          } else {
            & "$env:SystemRoot\System32\tar.exe" -xf sdk_download -C $dest
            if ($LASTEXITCODE -ne 0) { throw 'falha ao extrair o SDK' }
          }
          $f = Get-ChildItem -Path $dest -Recurse -Depth 3 -Filter air-sdk-description.xml | Select-Object -First 1
          if (-not $f) { throw 'air-sdk-description.xml nao encontrado: esse arquivo nao e o AIR SDK' }
          $sdk = $f.DirectoryName
          Get-Content "$sdk\air-sdk-description.xml" | ForEach-Object { Write-Host $_ }
          Write-Host 'Pasta runtimes do SDK:'
          Get-ChildItem "$sdk\runtimes" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          if (-not (Test-Path "$sdk\runtimes\air\win")) {
            Write-Host 'AVISO: este SDK nao tem runtimes\air\win. Se o empacotamento falhar, suba o "AIR SDK para Windows" (airsdk.harman.com) como release e use o link dele.'
          }
          "AIR_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        env:
          RUN_NUM: ${{ github.run_number }}
          INSTANCIAS: ${{ github.event.inputs.instancias }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:AIR_SDK
          $desc = Get-Content "$sdk\air-sdk-description.xml" -Raw
          $v = [regex]::Match($desc, '<version>([^<]+)</version>').Groups[1].Value
          $p = $v.Split('.')
          $ns = "$($p[0]).$($p[1])"
          Write-Host "AIR SDK $v (namespace $ns)"
          $n = 3
          if ($env:INSTANCIAS -match '^\d+$') { $n = [int]$env:INSTANCIAS }
          if ($n -lt 1) { $n = 1 }
          if ($n -gt 6) { $n = 6 }
          "INSTANCIAS_N=$n" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force build\app | Out-Null
          $xml = (Get-Content app.xml -Raw).Replace('NS_VERSION', $ns).Replace('VERSION_NUMBER', "1.0.$env:RUN_NUM").Replace('<supportedProfiles>desktop</supportedProfiles>', '<supportedProfiles>desktop extendedDesktop</supportedProfiles>')

          Write-Host '==> 1/3 Compilando o ActionScript'
          & "$sdk\bin\amxmlc.bat" -source-path src -default-size 1352 650 -output build\app\Main.swf src\Main.as
          if (-not (Test-Path build\app\Main.swf)) { throw 'amxmlc nao gerou o Main.swf (veja os erros acima)' }
          Copy-Item assets build\app\assets -Recurse

          Write-Host '==> 2/3 Certificado de assinatura'
          & "$sdk\bin\adt.bat" -certificate -cn LegendPC -validityPeriod 25 2048-RSA build\cert.p12 changeit
          if ($LASTEXITCODE -ne 0) { throw 'falha ao criar o certificado' }

          # O AIR so deixa UMA janela por aplicativo (mesmo id). Para abrir mais de um jogo ao mesmo tempo, cada instancia
          # e empacotada com id e nome proprios (com.meulauncher.pc, com.meulauncher.pc2, ...): sao apps separados para o Windows.
          Write-Host "==> 3/3 Empacotando $n instancia(s) (pasta com o LegendPC.exe)"
          for ($i = 1; $i -le $n; $i++) {
            $suf = ''
            $label = 'Legend PC'
            if ($i -gt 1) { $suf = "$i"; $label = "Legend PC $i" }
            $x = $xml.Replace('<id>com.meulauncher.pc</id>', "<id>com.meulauncher.pc$suf</id>").Replace('<filename>LegendPC</filename>', "<filename>LegendPC$suf</filename>").Replace('<name>Legend PC</name>', "<name>$label</name>").Replace('<title>Legend PC</title>', "<title>$label</title>")
            Set-Content "build\app\app$suf.xml" $x -Encoding utf8
            & "$sdk\bin\adt.bat" -package -storetype pkcs12 -keystore build\cert.p12 -storepass changeit -tsa none -target bundle "build\LegendPC$suf" "build\app\app$suf.xml" -C build\app Main.swf -C build\app assets
            if ($LASTEXITCODE -ne 0) { throw "falha ao empacotar a instancia $i (veja os erros acima)" }
            Write-Host "  ok: build\LegendPC$suf"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Navegador do login (Chromium atual, via Electron)
        working-directory: ${{ env.PROJ }}/login-helper
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --no-audit --no-fund --no-save electron@31
          if ($LASTEXITCODE -ne 0) { throw 'falha ao baixar o Electron (veja os erros acima)' }
          $dist = Join-Path (Get-Location) 'node_modules\electron\dist'
          if (-not (Test-Path "$dist\electron.exe")) { throw 'electron.exe nao encontrado em node_modules\electron\dist' }
          $dest = Join-Path $env:PROJ 'build\login'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$dist\*" $dest -Recurse -Force
          Rename-Item "$dest\electron.exe" 'LegendLogin.exe'
          Remove-Item "$dest\resources\default_app.asar" -Force -ErrorAction SilentlyContinue
          $app = Join-Path $dest 'resources\app'
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item main.js, package.json $app
          Get-ChildItem $dest | Select-Object -First 12 | ForEach-Object { Write-Host "  $($_.Name)" }
          # a pasta solta (artefato LegendPC-Windows) funciona sem instalar: leva uma copia do login dentro da LegendPC
          Copy-Item $dest (Join-Path $env:PROJ 'build\LegendPC\login') -Recurse -Force

      - name: Pacote .air alternativo (precisa do Adobe AIR no PC)
        continue-on-error: true
        working-directory: ${{ env.PROJ }}
        run: |
          & "$env:AIR_SDK\bin\adt.bat" -package -storetype pkcs12 -keystore build\cert.p12 -storepass changeit -tsa none -target air build\LegendPC.air build\app\app.xml -C build\app Main.swf -C build\app assets

      - uses: actions/upload-artifact@v4
        with:
          name: LegendPC-Windows
          path: ${{ env.PROJ }}/build/LegendPC

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LegendPC-air-alternativo
          path: ${{ env.PROJ }}/build/LegendPC.air

      - name: Instalador (LegendPC-Setup.exe com todas as instancias)
        working-directory: ${{ env.PROJ }}
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $n = [int]$env:INSTANCIAS_N
          $build = (Resolve-Path build).Path
          # o navegador do login fica numa pasta so (build\login), compartilhada pelas instancias
          Remove-Item "$build\LegendPC\login" -Recurse -Force -ErrorAction SilentlyContinue
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            Write-Host 'Instalando o Inno Setup...'
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { throw 'Inno Setup nao encontrado depois de instalar' }
          }
          $files = New-Object System.Collections.Generic.List[string]
          $icons = New-Object System.Collections.Generic.List[string]
          $files.Add("Source: `"$build\login\*`"; DestDir: `"{app}\login`"; Flags: recursesubdirs createallsubdirs ignoreversion")
          for ($i = 1; $i -le $n; $i++) {
            $suf = ''
            $label = 'Legend PC'
            if ($i -gt 1) { $suf = "$i"; $label = "Legend PC $i" }
            $files.Add("Source: `"$build\LegendPC$suf\*`"; DestDir: `"{app}\LegendPC$suf`"; Flags: recursesubdirs createallsubdirs ignoreversion")
            $icons.Add("Name: `"{autoprograms}\$label`"; Filename: `"{app}\LegendPC$suf\LegendPC$suf.exe`"; WorkingDir: `"{app}\LegendPC$suf`"")
            $icons.Add("Name: `"{autodesktop}\$label`"; Filename: `"{app}\LegendPC$suf\LegendPC$suf.exe`"; WorkingDir: `"{app}\LegendPC$suf`"; Tasks: desktopicon")
          }
          $lang = ''
          $pt = Join-Path (Split-Path $iscc) 'Languages\BrazilianPortuguese.isl'
          if (Test-Path $pt) { $lang = "[Languages]`nName: `"pt`"; MessagesFile: `"$pt`"`n" }
          $out = Join-Path $build 'Output'
          $tpl = Get-Content installer\LegendPC.iss.template -Raw
          $iss = $tpl.Replace('@APPVER@', "1.0.$env:RUN_NUM").Replace('@OUTDIR@', $out).Replace('@LANGUAGES@', $lang).Replace('@FILES@', ($files -join "`n")).Replace('@ICONS@', ($icons -join "`n"))
          Set-Content "$build\LegendPC.iss" $iss -Encoding utf8BOM
          & $iscc /Qp "$build\LegendPC.iss"
          if ($LASTEXITCODE -ne 0) { throw 'falha ao gerar o instalador (veja os erros acima)' }
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length / 1MB)) MB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: LegendPC-Instalador
          path: ${{ env.PROJ }}/build/Output/LegendPC-Setup.exe
          compression-level: 0
